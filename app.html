<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Generate professional invoices as PDFs with customizable templates, tax settings, and more.">
  <title>Invoice Generator</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>&#128196;</text></svg>">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>
  <nav class="nav">
    <div class="nav-inner">
      <a href="#/" class="nav-logo">Invoice</a>
      <div class="nav-links">
        <a href="#/create" class="nav-link">New Invoice</a>
        <a href="#/history" class="nav-link">History</a>
        <a href="#/settings" class="nav-link">Settings</a>
        <div id="theme-picker" class="theme-picker">
          <button id="theme-picker-btn" class="theme-picker-btn" onclick="toggleThemePicker()" title="Change theme">
            <span id="theme-picker-dot" class="theme-picker-dot"></span>
            <span id="theme-picker-label" class="theme-picker-label">Light</span>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"/></svg>
          </button>
          <div id="theme-picker-menu" class="theme-picker-menu">
            <button class="theme-picker-option" data-theme="light" onclick="setTheme('light')">
              <span class="theme-picker-dot" style="background:#f5f5f5;border:1px solid #ccc;"></span> Light
            </button>
            <button class="theme-picker-option" data-theme="dark" onclick="setTheme('dark')">
              <span class="theme-picker-dot" style="background:#0f1117;border:1px solid #444;"></span> Dark
            </button>
            <button class="theme-picker-option" data-theme="dracula" onclick="setTheme('dracula')">
              <span class="theme-picker-dot" style="background:#bd93f9;"></span> Dracula
            </button>
            <button class="theme-picker-option" data-theme="catppuccin" onclick="setTheme('catppuccin')">
              <span class="theme-picker-dot" style="background:#89b4fa;"></span> Catppuccin
            </button>
            <button class="theme-picker-option" data-theme="sepia" onclick="setTheme('sepia')">
              <span class="theme-picker-dot" style="background:#d4c5a9;"></span> Sepia
            </button>
            <button class="theme-picker-option" data-theme="kanagawa" onclick="setTheme('kanagawa')">
              <span class="theme-picker-dot" style="background:#7e9cd8;"></span> Kanagawa
            </button>
          </div>
        </div>
        <div id="nav-auth" style="display:flex;align-items:center;"></div>
      </div>
    </div>
  </nav>

  <main id="app"></main>

  <script src="js/utils.js"></script>
  <script src="js/api.js"></script>
  <script src="js/templates.js"></script>
  <script src="js/pdf.js"></script>
  <script src="js/components/nav.js"></script>
  <script src="js/components/auth.js"></script>
  <script src="js/components/dashboard.js"></script>
  <script src="js/components/form.js"></script>
  <script src="js/components/history.js"></script>
  <script src="js/components/settings.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
